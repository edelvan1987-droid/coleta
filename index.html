<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Coleta</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- iPhone / iPad: ícone e modo aplicativo (sem barra do Safari) -->
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coleta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box}
  iframe{border:0;width:100%;height:100%;display:block}
  .load{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,-apple-system,sans-serif;color:#667085;background:#fff;transition:opacity .3s}
  .load img{width:110px;height:110px;border-radius:24px}
</style>
</head>
<body>
<div class="load" id="load"><img src="icon-512.png" alt=""><span>Carregando a ficha…</span></div>
<!-- >>> https://script.google.com/macros/s/AKfycbwuIOONxEtbNanEcyXtcnIZ3SkuypC9mzytacc8gsvXWx8thH0OFw6K5V4nfEcpdk6gFQ/exec <<< -->
<iframe id="app" src="COLE_AQUI_O_LINK_EXEC" allow="clipboard-write"></iframe>
<script>
  document.getElementById('app').addEventListener('load',function(){
    var l=document.getElementById('load');l.style.opacity=0;setTimeout(function(){l.remove()},300);
  });
</script>
</body>
</html>
